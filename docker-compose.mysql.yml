version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ai_insights_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ai_insights
      MYSQL_USER: ai_user
      MYSQL_PASSWORD: ai_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/setup_mysql_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/test_multi_table_schema.sql:/docker-entrypoint-initdb.d/02-test-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_insights_network

  adminer:
    image: adminer:latest
    container_name: ai_insights_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: nette
    depends_on:
      - mysql
    networks:
      - ai_insights_network

volumes:
  mysql_data:
    driver: local

networks:
  ai_insights_network:
    driver: bridge
